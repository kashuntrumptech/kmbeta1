<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座枱巴士實時報站系統</title>
  
  <!-- PWA 全螢幕/App 化設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="巴士報站">
  <meta name="theme-color" content="#0d0d0d">
  
  <link rel="manifest" href="manifest.json">

  <!-- 引入 Tailwind CSS 與 Font Awesome 圖標 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+HK:wght@400;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans HK', sans-serif;
      background-color: #0d0d0d;
      color: #f3f4f6;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .led-text {
      font-family: 'Share Tech Mono', 'Noto Sans HK', monospace;
    }

    /* 橘黃色 LED */
    .led-orange {
      color: #ff9f0a;
      text-shadow: 0 0 8px rgba(255, 159, 10, 0.6);
    }

    /* 綠色 LED */
    .led-green {
      color: #30d158;
      text-shadow: 0 0 8px rgba(48, 209, 88, 0.6);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #666;
    }
  </style>
</head>
<body class="flex flex-col justify-between p-4 relative">

  <!-- 頂部狀態欄 (支持放大/縮小模式 & 獨立公司連線狀態) -->
  <header id="top-header" class="flex justify-between items-center border-b border-zinc-800 pb-2 z-10 shrink-0 transition-all duration-300">
    <!-- 獨立巴士公司連線狀態區 -->
    <div id="status-container" class="flex flex-wrap items-center gap-3 transition-all duration-300 text-[10px] md:text-xs">
      <span class="text-zinc-500 font-bold transition-all duration-300">連線:</span>
      <!-- 九巴 -->
      <div id="status-kmb" class="flex items-center gap-1 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800 transition-all duration-300">
        <span id="dot-kmb" class="w-2 h-2 rounded-full bg-orange-500 animate-pulse transition-all duration-300"></span>
        <span class="font-bold text-amber-500 transition-all duration-300">KMB (載入中)</span>
      </div>
      <!-- 城巴 -->
      <div id="status-ctb" class="flex items-center gap-1 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800 transition-all duration-300">
        <span id="dot-ctb" class="w-2 h-2 rounded-full bg-orange-500 animate-pulse transition-all duration-300"></span>
        <span class="font-bold text-amber-500 transition-all duration-300">CTB (載入中)</span>
      </div>
      <!-- 嶼巴 -->
      <div id="status-nlb" class="flex items-center gap-1 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800 transition-all duration-300">
        <span id="dot-nlb" class="w-2 h-2 rounded-full bg-orange-500 animate-pulse transition-all duration-300"></span>
        <span class="font-bold text-amber-500 transition-all duration-300">NLB (載入中)</span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- 系統時鐘 -->
      <span id="system-clock" class="text-sm font-bold text-zinc-300 font-mono mr-2 transition-all duration-300">12:00:00</span>
      
      <!-- 放大/縮小按鈕 -->
      <button id="btn-toggle-zoom" class="text-zinc-400 hover:text-white transition-all p-1.5 rounded bg-zinc-900 border border-zinc-800 hover:border-zinc-700 flex items-center gap-1.5 transition-all duration-300" title="切換放大/縮小模式">
        <i id="zoom-icon" class="fa-solid fa-magnifying-glass-plus text-base text-zinc-400"></i>
        <span id="zoom-text" class="text-xs font-bold text-zinc-300 hidden md:inline">放大/縮小</span>
      </button>

      <!-- 搜尋及設定按鈕 -->
      <button id="btn-toggle-settings" class="text-zinc-400 hover:text-white transition-all p-1.5 rounded bg-zinc-900 border border-zinc-800 hover:border-zinc-700 flex items-center gap-1.5 transition-all duration-300" title="搜尋及設定路線">
        <i class="fa-solid fa-magnifying-glass text-base"></i>
        <span id="search-btn-text" class="text-xs font-bold text-zinc-300 hidden md:inline">搜尋/設定</span>
      </button>
    </div>
  </header>

  <!-- 主顯示區 -->
  <main id="main-display" class="flex-1 flex flex-col justify-center gap-3 my-4 overflow-hidden">
    <div id="no-data-tip" class="text-center text-zinc-500 py-10 flex flex-col items-center justify-center gap-4 flex-1">
      <i class="fa-solid fa-bus text-5xl text-zinc-700 animate-bounce"></i>
      <p class="text-lg">未加入任何路線</p>
      <p class="text-xs text-zinc-600">請點擊右上角 <i class="fa-solid fa-magnifying-glass"></i> 開始設定你的多公司報站板</p>
    </div>
  </main>

  <!-- 底部更新時間提示 (支持放大/縮小模式) -->
  <footer id="bottom-footer" class="flex justify-between items-center text-[10px] text-zinc-500 border-t border-zinc-900 pt-2 shrink-0 transition-all duration-300">
    <span id="last-update">最後更新: 未更新</span>
    <span class="flex items-center gap-1">
      <span id="update-dot" class="inline-block w-2 h-2 rounded-full bg-orange-500"></span>
      <span id="update-text">每 30 秒自動更新 (支援 KMB | CTB | NLB)</span>
    </span>
  </footer>

  <!-- 設定彈出視窗 -->
  <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-lg rounded-xl flex flex-col max-h-[85vh] shadow-2xl">
      
      <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
        <h3 class="font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-orange-500"></i> 設定我的最愛路線
        </h3>
        <button id="btn-close-settings" class="text-zinc-400 hover:text-white text-xl">&times;</button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 custom-scrollbar space-y-4">
        
        <!-- 第一步：搜尋巴士路線 -->
        <div class="space-y-2">
          <label class="text-xs font-semibold text-zinc-400 block">第一步：搜尋路線 (支援九巴、城巴、嶼巴)</label>
          <div class="flex gap-2 relative">
            <div class="relative flex-1">
              <input type="text" id="input-route" autocomplete="off" placeholder="例如: 960, 6A, B2P, 1A" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500 uppercase font-mono">
              <div id="suggestions-box" class="absolute left-0 right-0 mt-1 bg-zinc-800 border border-zinc-700 rounded-lg max-h-48 overflow-y-auto z-50 hidden custom-scrollbar shadow-xl"></div>
            </div>
            <button id="btn-search" class="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-lg font-bold transition-colors shrink-0">
              搜尋
            </button>
          </div>
        </div>

        <!-- 第二步：選擇方向 -->
        <div id="section-bound" class="space-y-2 hidden">
          <label class="text-xs font-semibold text-zinc-400 block">第二步：選擇行車方向</label>
          <div class="grid grid-cols-1 gap-2" id="bound-container"></div>
        </div>

        <!-- 第三步：選擇車站 -->
        <div id="section-stop" class="space-y-2 hidden">
          <label class="text-xs font-semibold text-zinc-400 block">第三步：選擇上車車站</label>
          <div class="relative">
            <select id="select-stop" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-orange-500 max-h-48">
              <option value="">-- 請選擇車站 --</option>
            </select>
          </div>
          <button id="btn-add-favorite" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg font-bold transition-colors mt-2 flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"></i> 加入「我的最愛」
          </button>
        </div>

        <!-- 我的最愛清單 -->
        <div class="pt-4 border-t border-zinc-800">
          <label class="text-xs font-semibold text-zinc-400 block mb-2">已儲存的路線 (最多建議 4-5 條)</label>
          <div id="favorite-list" class="space-y-2">
            <p class="text-zinc-600 text-xs text-center py-4">暫無儲存路線</p>
          </div>
        </div>

      </div>

      <div class="p-4 border-t border-zinc-800 flex justify-end">
        <button id="btn-save-confirm" class="bg-zinc-800 hover:bg-zinc-700 text-white px-6 py-2 rounded-lg font-semibold transition-colors">
          完成設定
        </button>
      </div>

    </div>
  </div>

  <!-- 吐司通知提示 -->
  <div id="toast" class="fixed bottom-12 left-1/2 transform -translate-x-1/2 bg-zinc-800 border border-zinc-700 text-white text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 transition-all duration-300 translate-y-10 opacity-0 pointer-events-none z-50">
    <span id="toast-msg">提示訊息</span>
  </div>

  <!-- JavaScript 邏輯區 -->
  <script>
    const API_KMB_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
    const API_CTB_BASE = "https://rt.data.gov.hk/v1.1/transport/citybus-nwfb";
    const API_NLB_BASE = "https://rt.data.gov.hk/v2/transport/nlb";

    let favorites = [];
    let allRoutes = []; // 包含所有公司的路線
    let currentRouteData = null; 
    let currentStops = []; 
    let isZoomedTop = false; // 是否開啟最上方與最下方欄位放大模式

    // 獨立巴士 company 加載與重試狀態追蹤
    let states = {
      KMB: { loaded: false, retries: 0 },
      CTB: { loaded: false, retries: 0 },
      NLB: { loaded: false, retries: 0 }
    };

    // DOM Elements
    const domHeader = document.getElementById('top-header');
    const domFooter = document.getElementById('bottom-footer');
    const domClock = document.getElementById('system-clock');
    const btnToggleZoom = document.getElementById('btn-toggle-zoom');
    const zoomIcon = document.getElementById('zoom-icon');
    const zoomText = document.getElementById('zoom-text');
    const btnToggleSettings = document.getElementById('btn-toggle-settings');
    const searchBtnText = document.getElementById('search-btn-text');

    const domMainDisplay = document.getElementById('main-display');
    const domNoDataTip = document.getElementById('no-data-tip');
    const domLastUpdate = document.getElementById('last-update');
    
    const modalSettings = document.getElementById('settings-modal');
    const btnCloseSettings = document.getElementById('btn-close-settings');
    const btnSaveConfirm = document.getElementById('btn-save-confirm');

    const inputRoute = document.getElementById('input-route');
    const suggestionsBox = document.getElementById('suggestions-box');
    const btnSearch = document.getElementById('btn-search');
    const sectionBound = document.getElementById('section-bound');
    const boundContainer = document.getElementById('bound-container');
    const sectionStop = document.getElementById('section-stop');
    const selectStop = document.getElementById('select-stop');
    const btnAddFav = document.getElementById('btn-add-favorite');
    const favoriteList = document.getElementById('favorite-list');

    const domToast = document.getElementById('toast');
    const domToastMsg = document.getElementById('toast-msg');

    window.addEventListener('load', async () => {
      // 1. 載入最愛路線
      const saved = localStorage.getItem('desktop_bus_favorites');
      if (saved) {
        try { favorites = JSON.parse(saved); } catch(e) { favorites = []; }
      }

      // 2. 載入放大設定並更新 UI
      const savedZoom = localStorage.getItem('desktop_bus_zoom');
      isZoomedTop = savedZoom === 'true';
      updateHeaderZoomUI();

      // 3. 啟動時鐘與渲染最愛路線 (不等待 API 下載完成，直接渲染！)
      startClock();
      renderMainBoard();
      
      // 4. 立即獲取實時 ETA 數據 (確保一開機立刻看到巴士時間！)
      fetchAndUpdateAllETA();
      setInterval(fetchAndUpdateAllETA, 30000);

      // 5. 背景獨立且可重複嘗試的載入各公司路線數據（用於搜尋聯想，不阻塞主畫面運作）
      loadKMB();
      loadCTB();
      loadNLB();

      // 6. 背景自動為舊最愛路線補齊「途經車站」與修補自癒
      silentlyUpdateMissingViaStops();

      initEventListeners();
    });

    function startClock() {
      setInterval(() => {
        const now = new Date();
        domClock.textContent = now.toTimeString().split(' ')[0];
      }, 1000);
    }

    function showToast(msg) {
      domToastMsg.textContent = msg;
      domToast.classList.remove('translate-y-10', 'opacity-0');
      domToast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        domToast.classList.remove('translate-y-0', 'opacity-100');
        domToast.classList.add('translate-y-10', 'opacity-0');
      }, 3000);
    }

    // ==================== 智能欄位解析安全獲取器 ====================
    function getSafeStopName(item) {
      if (!item) return '未知車站';
      return item.stopName_tc || 
             item.stop_name_tc || 
             item.name_tc || 
             item.stopName_en || 
             item.stop_name || 
             item.stopName ||
             Object.values(item).find(val => typeof val === 'string' && val.length > 2 && !val.includes('.') && isNaN(val)) ||
             '未知車站';
    }

    function getSafeRouteOrig(r) {
      if (!r) return '起點';
      let orig = r.orig_tc || r.orig || r.startPoint_tc;
      if (orig && orig !== '起點' && orig !== 'undefined') return orig;
      
      // 核心安全修復：安全轉義減號，相容全/半形及多種特殊分隔符
      let name = r.routeName_tc || r.routeName_sc || r.routeName_en || r.routeName || '';
      if (name && typeof name === 'string') {
        const parts = name.split(/\s*[\-－–—~～>＞→往/]\s*/);
        if (parts.length >= 1 && parts[0]) return parts[0].trim();
        return name.trim(); // 終極安全 fallback
      }
      return '起點';
    }

    function getSafeRouteDest(r) {
      if (!r) return '目的地';
      let dest = r.dest_tc || r.dest || r.destination_tc;
      if (dest && dest !== '目的地' && dest !== 'undefined') return dest;
      
      // 核心安全修復：安全轉義減號，相容全/半形及多種特殊分隔符
      let name = r.routeName_tc || r.routeName_sc || r.routeName_en || r.routeName || '';
      if (name && typeof name === 'string') {
        const parts = name.split(/\s*[\-－–—~～>＞→往/]\s*/);
        if (parts.length >= 2 && parts[parts.length - 1]) return parts[parts.length - 1].trim();
        return name.trim(); // 終極安全 fallback：防止分割失敗返回 "目的地" 或 "undefined"
      }
      return '目的地';
    }

    // ==================== 獨立狀態 UI 更新 ====================
    function updateCompanyStatus(co, state) {
      const dot = document.getElementById(`dot-${co.toLowerCase()}`);
      const container = document.getElementById(`status-${co.toLowerCase()}`);
      const label = container ? container.querySelector('span:not([id])') : null;

      if (!dot || !container || !label) return;

      const dotSizeClass = isZoomedTop ? "w-3.5 h-3.5 md:w-4.5 md:h-4.5" : "w-2 h-2";
      dot.className = `rounded-full transition-all duration-300 ${dotSizeClass}`;

      if (state === 'loading') {
        dot.className = `rounded-full bg-amber-500 animate-pulse transition-all duration-300 ${dotSizeClass}`;
        label.textContent = `${co} (載入中)`;
        label.className = "font-bold text-amber-400 text-[10px] md:text-xs transition-all duration-300";
      } else if (state === 'success') {
        dot.className = `rounded-full bg-emerald-500 transition-all duration-300 ${dotSizeClass}`;
        label.textContent = co;
        label.className = "font-bold text-zinc-300 text-[10px] md:text-xs transition-all duration-300";
      } else if (state === 'failed') {
        dot.className = `rounded-full bg-red-500 animate-pulse transition-all duration-300 ${dotSizeClass}`;
        label.textContent = `${co} (重試中)`;
        label.className = "font-bold text-red-500 text-[10px] md:text-xs transition-all duration-300";
      }

      // 如果在大字模式下微調字體
      if (isZoomedTop) {
        label.classList.remove('text-[10px]', 'md:text-xs');
        label.classList.add('text-xs', 'md:text-base');
      }
    }

    // ==================== 獨立、可重試之背景下載通道 (直至成功) ====================
    async function loadKMB() {
      if (states.KMB.loaded) return;
      updateCompanyStatus('KMB', 'loading');
      
      const cacheBust = `_t=${Date.now()}`;
      try {
        const res = await fetch(`${API_KMB_BASE}/route?${cacheBust}`);
        if (!res.ok) throw new Error("KMB HTTP error");
        const json = await res.json();
        if (json.data && json.data.length > 0) {
          const mapped = json.data.map(r => ({
            co: 'KMB',
            route: r.route,
            orig: getSafeRouteOrig(r),
            dest: getSafeRouteDest(r),
            bound: r.bound,
            serviceType: r.service_type
          }));
          
          allRoutes = allRoutes.filter(r => r.co !== 'KMB').concat(mapped);
          states.KMB.loaded = true;
          updateCompanyStatus('KMB', 'success');
          console.log(`[連線] 九巴路線預載成功，共 ${mapped.length} 條。`);
          return;
        }
        throw new Error("KMB data empty");
      } catch(e) {
        console.warn("[連線] 九巴 (KMB) 載入失敗，10 秒後將自動重新嘗試...", e);
      }
      states.KMB.retries++;
      updateCompanyStatus('KMB', 'failed');
      setTimeout(loadKMB, 10000); // 10秒後無限重試
    }

    async function loadCTB() {
      if (states.CTB.loaded) return;
      updateCompanyStatus('CTB', 'loading');
      
      const cacheBust = `_t=${Date.now()}`;
      try {
        const res = await fetch(`${API_CTB_BASE}/route/ctb?${cacheBust}`);
        if (!res.ok) throw new Error("CTB HTTP error");
        const json = await res.json();
        if (json.data && json.data.length > 0) {
          const mapped = json.data.map(r => ({
            co: 'CTB',
            route: r.route,
            orig: getSafeRouteOrig(r),
            dest: getSafeRouteDest(r),
            bound: r.dir, 
            serviceType: '1'
          }));
          
          allRoutes = allRoutes.filter(r => r.co !== 'CTB').concat(mapped);
          states.CTB.loaded = true;
          updateCompanyStatus('CTB', 'success');
          console.log(`[連線] 城巴路線預載成功，共 ${mapped.length} 條。`);
          return;
        }
        throw new Error("CTB data empty");
      } catch(e) {
        console.warn("[連線] 城巴 (CTB) 載入失敗，10 秒後將自動重新嘗試...", e);
      }
      states.CTB.retries++;
      updateCompanyStatus('CTB', 'failed');
      setTimeout(loadCTB, 10000); // 10秒後無限重試
    }

    async function loadNLB() {
      if (states.NLB.loaded) return;
      updateCompanyStatus('NLB', 'loading');
      
      const cacheBust = `_t=${Date.now()}`;
      try {
        const res = await fetch(`${API_NLB_BASE}/route.php?action=list&${cacheBust}`);
        if (!res.ok) throw new Error("NLB HTTP error");
        const json = await res.json();
        if (json.routes && json.routes.length > 0) {
          // 輸出除錯資訊以確認 NLB 資料結構
          console.log("[除錯] 嶼巴第一條路線原始數據:", json.routes[0]);
          
          const mapped = json.routes.map(r => ({
            co: 'NLB',
            route: r.routeNo,
            routeId: r.routeId,
            orig: getSafeRouteOrig(r),
            dest: getSafeRouteDest(r), 
            bound: r.routeId, // 🌟 關鍵修正：嶼巴去回程完全獨立，直接以 routeId 作為 bound 避免被合併！
            serviceType: '1'
          }));
          
          allRoutes = allRoutes.filter(r => r.co !== 'NLB').concat(mapped);
          states.NLB.loaded = true;
          updateCompanyStatus('NLB', 'success');
          console.log(`[連線] 嶼巴路線預載成功，共 ${mapped.length} 條。第一條解析後:`, mapped[0]);
          
          // 當嶼巴加載完成後，立刻自愈修復舊路線（關鍵自癒！）
          silentlyUpdateMissingViaStops();
          fetchAndUpdateAllETA();
          return;
        }
        throw new Error("NLB data empty");
      } catch(e) {
        console.warn("[連線] 嶼巴 (NLB) 載入失敗，10 秒後將自動重新嘗試...", e);
      }
      states.NLB.retries++;
      updateCompanyStatus('NLB', 'failed');
      setTimeout(loadNLB, 10000); // 10秒後無限重試
    }

    function initEventListeners() {
      // 搜尋設定按鈕
      btnToggleSettings.addEventListener('click', () => {
        renderSettingsFavorites();
        modalSettings.classList.remove('hidden');
      });
      btnCloseSettings.addEventListener('click', () => {
        modalSettings.classList.add('hidden');
        suggestionsBox.classList.add('hidden');
      });
      btnSaveConfirm.addEventListener('click', () => {
        modalSettings.classList.add('hidden');
        suggestionsBox.classList.add('hidden');
        renderMainBoard();
        fetchAndUpdateAllETA();
      });

      // 放大/縮小按鈕切換
      btnToggleZoom.addEventListener('click', () => {
        isZoomedTop = !isZoomedTop;
        localStorage.setItem('desktop_bus_zoom', isZoomedTop);
        updateHeaderZoomUI();
        showToast(isZoomedTop ? "已啟用「放大模式」" : "已啟用「縮小模式」");
      });

      btnSearch.addEventListener('click', () => {
        suggestionsBox.classList.add('hidden');
        searchRoute();
      });
      
      inputRoute.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          suggestionsBox.classList.add('hidden');
          searchRoute();
        }
      });

      inputRoute.addEventListener('input', handleRouteInput);

      document.addEventListener('click', (e) => {
        if (!inputRoute.contains(e.target) && !suggestionsBox.contains(e.target)) {
          suggestionsBox.classList.add('hidden');
        }
      });

      btnAddFav.addEventListener('click', addToFavorites);
    }

    // ==================== 自動聯想搜尋 ====================
    function handleRouteInput() {
      const query = inputRoute.value.trim().toUpperCase();
      if (!query) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      if (allRoutes.length === 0) {
        suggestionsBox.innerHTML = `<div class="px-3 py-2 text-zinc-500 text-xs font-bold">預載路線中，請稍候...</div>`;
        suggestionsBox.classList.remove('hidden');
        return;
      }

      const uniqueRoutes = [];
      const seen = new Set();

      allRoutes.forEach(r => {
        const key = `${r.co}_${r.route}`;
        if (!seen.has(key) && r.route.startsWith(query)) {
          seen.add(key);
          uniqueRoutes.push(r);
        }
      });

      if (uniqueRoutes.length < 10) {
        allRoutes.forEach(r => {
          const key = `${r.co}_${r.route}`;
          if (!seen.has(key) && r.route.includes(query)) {
            seen.add(key);
            uniqueRoutes.push(r);
          }
        });
      }

      const matches = uniqueRoutes.slice(0, 15);

      if (matches.length > 0) {
        suggestionsBox.innerHTML = matches.map(r => {
          let coColor = "bg-red-600";
          if (r.co === 'CTB') coColor = "bg-yellow-500 text-black";
          if (r.co === 'NLB') coColor = "bg-green-600";

          return `
            <div class="px-3 py-2 hover:bg-zinc-700 cursor-pointer flex justify-between items-center border-b border-zinc-800/60 last:border-b-0"
                 onclick="selectSuggestion('${r.route}', '${r.co}')">
              <span class="font-mono font-bold text-white">${r.route}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${coColor}">${r.co}</span>
            </div>
          `;
        }).join('');
        suggestionsBox.classList.remove('hidden');
      } else {
        suggestionsBox.classList.add('hidden');
      }
    }

    window.selectSuggestion = function(route, co) {
      inputRoute.value = route;
      suggestionsBox.classList.add('hidden');
      searchRoute(co); 
    };

    // ==================== 搜尋路線 (加入智能即時 API 雙重備份) ====================
    async function searchRoute(targetCo = null) {
      const route = inputRoute.value.trim().toUpperCase();
      if (!route) {
        showToast("請輸入路線！");
        return;
      }

      btnSearch.disabled = true;
      btnSearch.textContent = "搜尋中...";

      try {
        // 1. 先從本地預載好的清單中找
        let filtered = allRoutes.filter(r => r.route === route);
        if (targetCo) {
          filtered = filtered.filter(r => r.co === targetCo);
        }

        if (filtered.length > 0) {
          currentRouteData = filtered;
          showBoundSelection(filtered);
          return;
        }

        // 2. 本地找不到時，直接發起網絡即時查詢
        showToast("正在直接連線查詢巴士路線...");

        // 嘗試直接查詢九巴 (KMB) 的路線站點接口
        try {
          const kmbRes = await fetch(`${API_KMB_BASE}/route-stop/${route}/outbound/1`);
          if (kmbRes.ok) {
            const kmbJson = await kmbRes.json();
            if (kmbJson.data && kmbJson.data.length > 0) {
              const firstStopId = kmbJson.data[0].stop;
              const lastStopId = kmbJson.data[kmbJson.data.length - 1].stop;
              
              let firstStopName = "起點";
              let lastStopName = "終點";
              
              try {
                const fRes = await fetch(`${API_KMB_BASE}/stop/${firstStopId}`);
                const fJson = await fRes.json();
                firstStopName = getSafeStopName(fJson.data);
                
                const lRes = await fetch(`${API_KMB_BASE}/stop/${lastStopId}`);
                const lJson = await lRes.json();
                lastStopName = getSafeStopName(lJson.data);
              } catch(e) {}

              const kmbDirectRoute = [
                { co: 'KMB', route: route, orig: firstStopName, dest: lastStopName, bound: 'O', serviceType: '1' },
                { co: 'KMB', route: route, orig: lastStopName, dest: firstStopName, bound: 'I', serviceType: '1' }
              ];
              
              allRoutes.push(...kmbDirectRoute);
              currentRouteData = kmbDirectRoute;
              showBoundSelection(kmbDirectRoute);
              return;
            }
          }
        } catch(e) { console.warn("直接連線 KMB 失敗:", e); }

        // 嘗試直接查詢城巴 (CTB) 接口
        try {
          const ctbRes = await fetch(`${API_CTB_BASE}/route/ctb/${route}`);
          if (ctbRes.ok) {
            const ctbJson = await ctbRes.json();
            if (ctbJson.data) {
              const r = ctbJson.data;
              const ctbDirectRoute = [
                { co: 'CTB', route: route, orig: r.orig_tc, dest: r.dest_tc, bound: 'O', serviceType: '1' },
                { co: 'CTB', route: route, orig: r.dest_tc, orig: r.dest_tc, bound: 'I', serviceType: '1' }
              ];
              allRoutes.push(...ctbDirectRoute);
              currentRouteData = ctbDirectRoute;
              showBoundSelection(ctbDirectRoute);
              return;
            }
          }
        } catch(e) { console.warn("直接連線 CTB 失敗:", e); }

        // 如果所有方式都查不到
        showToast(`找不到路線 ${route}，請檢查輸入是否正確。`);
        resetSearchSteps(false);

      } catch (error) {
        showToast("搜尋出錯，請確保網絡正常。");
      } finally {
        btnSearch.disabled = false;
        btnSearch.textContent = "搜尋";
      }
    }

    function resetSearchSteps(resetInput = true) {
      if (resetInput) inputRoute.value = "";
      sectionBound.classList.add('hidden');
      sectionStop.classList.add('hidden');
      boundContainer.innerHTML = "";
      selectStop.innerHTML = '<option value="">-- 請選擇車站 --</option>';
      currentRouteData = null;
      currentStops = [];
    }

    // ==================== 顯示方向選擇 (內置合併相同路線相同目的地邏輯) ====================
    function showBoundSelection(routeOptions) {
      boundContainer.innerHTML = "";
      sectionBound.classList.remove('hidden');
      sectionStop.classList.add('hidden');

      const mergedOptions = [];
      const seenKeys = new Set();

      routeOptions.forEach(opt => {
        const destTrimmed = opt.dest ? opt.dest.trim() : "";
        const key = `${opt.co}_${opt.bound}_${destTrimmed}`;
        
        if (!seenKeys.has(key)) {
          seenKeys.add(key);
          mergedOptions.push(opt);
        } else {
          const existingIndex = mergedOptions.findIndex(o => `${o.co}_${o.bound}_${o.dest ? o.dest.trim() : ""}` === key);
          if (existingIndex !== -1) {
            const existing = mergedOptions[existingIndex];
            const currentType = parseInt(opt.serviceType) || 1;
            const existingType = parseInt(existing.serviceType) || 1;
            if (currentType < existingType) {
              mergedOptions[existingIndex] = opt; 
            }
          }
        }
      });

      mergedOptions.forEach(opt => {
        let boundText = opt.bound === 'O' ? '去程' : '回程';
        if (opt.co === 'NLB') boundText = "專線班次"; // 🌟 嶼巴方向以目的地為主

        let coColor = "border-red-500 text-red-500";
        if (opt.co === 'CTB') coColor = "border-yellow-500 text-yellow-500";
        if (opt.co === 'NLB') coColor = "border-green-500 text-green-500";

        const btn = document.createElement('button');
        btn.className = "bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white rounded-lg p-3 text-sm transition-colors text-left flex justify-between items-center w-full";
        btn.innerHTML = `
          <div>
            <span class="text-xs text-zinc-400 font-bold">${boundText}</span>
            <span class="text-base text-zinc-100 font-bold block mt-0.5">往 ${opt.dest}</span>
          </div>
          <span class="text-xs font-bold px-2 py-0.5 border rounded shrink-0 ml-2 ${coColor}">${opt.co}</span>
        `;
        btn.addEventListener('click', () => {
          selectBound(opt);
          Array.from(boundContainer.children).forEach(c => c.classList.remove('border-orange-500', 'bg-orange-950/20'));
          btn.classList.add('border-orange-500', 'bg-orange-950/20');
        });
        boundContainer.appendChild(btn);
      });
    }

    // ==================== 選擇方向，載入車站 ====================
    async function selectBound(opt) {
      selectStop.innerHTML = '<option value="">讀取車站中...</option>';
      sectionStop.classList.remove('hidden');
      currentStops = [];

      try {
        if (opt.co === 'KMB') {
          const dirStr = opt.bound === 'O' ? 'outbound' : 'inbound';
          const res = await fetch(`${API_KMB_BASE}/route-stop/${opt.route}/${dirStr}/${opt.serviceType}`);
          const json = await res.json();
          if (json.data) {
            showToast("正在載入車站清單...");
            const promises = json.data.slice(0, 50).map(async (item) => {
              const r = await fetch(`${API_KMB_BASE}/stop/${item.stop}`);
              const d = await r.json();
              return {
                seq: item.seq,
                stopId: item.stop,
                stopName: getSafeStopName(d.data),
                route: opt.route,
                bound: opt.bound,
                serviceType: opt.serviceType,
                co: 'KMB',
                destName: opt.dest
              };
            });
            currentStops = await Promise.all(promises);
          }
        } 
        else if (opt.co === 'CTB') {
          const dirStr = opt.bound === 'O' ? 'outbound' : 'inbound';
          const res = await fetch(`${API_CTB_BASE}/stop/ctb/${opt.route}/${dirStr}`);
          const json = await res.json();
          if (json.data) {
            showToast("正在載入車站清單...");
            const promises = json.data.slice(0, 50).map(async (item) => {
              const r = await fetch(`${API_CTB_BASE}/stop/${item.stop}`);
              const d = await r.json();
              return {
                seq: item.seq,
                stopId: item.stop,
                stopName: getSafeStopName(d.data),
                route: opt.route,
                bound: opt.bound,
                serviceType: '1',
                co: 'CTB',
                destName: opt.dest
              };
            });
            currentStops = await Promise.all(promises);
          }
        }
        else if (opt.co === 'NLB') {
          // NLB 專用方向加載
          const res = await fetch(`${API_NLB_BASE}/stop.php?action=list&routeId=${opt.routeId}`);
          const json = await res.json();
          if (json.stops) {
            currentStops = json.stops.map((item, idx) => ({
              seq: idx + 1,
              stopId: item.stopId,
              stopName: getSafeStopName(item), 
              route: opt.route,
              routeId: opt.routeId, 
              bound: opt.routeId, // NLB 的 bound 採用其 routeId
              serviceType: '1',
              co: 'NLB',
              destName: opt.dest
            }));
          }
        }

        selectStop.innerHTML = '<option value="">-- 請選擇車站 --</option>';
        currentStops.forEach(stop => {
          const o = document.createElement('option');
          o.value = stop.stopId;
          o.textContent = `${stop.seq}. ${stop.stopName}`;
          selectStop.appendChild(o);
        });
        showToast("車站載入完成！");

      } catch (e) {
        console.error(e);
        showToast("載入車站失敗。");
        selectStop.innerHTML = '<option value="">載入失敗</option>';
      }
    }

    // ==================== 加入我的最愛 (含途經車站獲取) ====================
    function addToFavorites() {
      const selectedStopId = selectStop.value;
      if (!selectedStopId) {
        showToast("請選擇車站！");
        return;
      }

      const stopObj = currentStops.find(s => s.stopId === selectedStopId);
      if (!stopObj) return;

      const isExist = favorites.some(fav => 
        fav.route === stopObj.route && 
        fav.co === stopObj.co &&
        fav.stopId === stopObj.stopId &&
        fav.bound === stopObj.bound
      );

      if (isExist) {
        showToast("該路線車站已在最愛清單中。");
        return;
      }

      const stopIndex = currentStops.findIndex(s => s.stopId === selectedStopId);
      const viaStops = currentStops.slice(stopIndex + 1, stopIndex + 4).map(s => s.stopName);

      favorites.push({
        route: stopObj.route,
        routeId: stopObj.routeId || null,
        bound: stopObj.bound,
        boundName: stopObj.destName,
        stopId: stopObj.stopId,
        stopName: stopObj.stopName,
        serviceType: stopObj.serviceType,
        co: stopObj.co,
        viaStops: viaStops 
      });

      saveFavorites();
      renderSettingsFavorites();
      resetSearchSteps(true);
      showToast("已成功加入！");
    }

    // 智能極強自癒系統：自動比對上車站，在背景自動匹配修正最愛中的 NLB 方向、正確的 routeId 與目的地！
    async function silentlyUpdateMissingViaStops() {
      let updated = false;
      for (let i = 0; i < favorites.length; i++) {
        const fav = favorites[i];

        // 1. [動態超強自癒] 如果是嶼巴，透過查詢各方向站點，動態匹配正確的 routeId 與目的地！
        if (fav.co === 'NLB' && (!fav.routeId || fav.bound === 'O' || fav.boundName === '目的地' || fav.boundName === 'undefined' || fav.boundName === '')) {
          const matchingNLBRoutes = allRoutes.filter(r => r.co === 'NLB' && r.route === fav.route);
          
          if (matchingNLBRoutes.length > 0) {
            console.log(`[自癒] 發現受損或舊版嶼巴路線 ${fav.route}，正在聯網核對車站...`);
            for (const r of matchingNLBRoutes) {
              try {
                const res = await fetch(`${API_NLB_BASE}/stop.php?action=list&routeId=${r.routeId}`);
                const json = await res.json();
                if (json.stops && json.stops.some(s => s.stopId === fav.stopId)) {
                  fav.routeId = r.routeId;
                  fav.bound = r.routeId; 
                  fav.boundName = r.dest; 
                  
                  const stopIndex = json.stops.findIndex(s => s.stopId === fav.stopId);
                  fav.viaStops = json.stops.slice(stopIndex + 1, stopIndex + 4).map(s => getSafeStopName(s));
                  
                  updated = true;
                  console.log(`[自動修復成功] 成功將嶼巴 ${fav.route} 修復為：往 ${fav.boundName} (routeId: ${fav.routeId})`);
                  break;
                }
              } catch(e) { 
                console.error("嶼巴背景匹配個別路線時出錯:", e); 
              }
            }
          }
        }

        // 2. [自動自癒] 補全可能顯示為 "目的地" 或 "undefined" 的正確行車目的地（城巴、九巴通用）
        if ((!fav.boundName || fav.boundName === '目的地' || fav.boundName === 'undefined') && allRoutes.length > 0) {
          const foundRoute = allRoutes.find(r => r.co === fav.co && r.route === fav.route && r.bound === fav.bound);
          if (foundRoute) {
            fav.boundName = foundRoute.dest;
            updated = true;
            console.log(`[自動修復] 成功將最愛路線 ${fav.route} 的目的地名稱修復為 ${fav.boundName}。`);
          }
        }

        // 3. 補全缺失的途經站名稱 (viaStops)
        if (!fav.viaStops || fav.viaStops.length === 0) {
          try {
            let fetchedStops = [];
            if (fav.co === 'KMB') {
              const dirStr = fav.bound === 'O' ? 'outbound' : 'inbound';
              const res = await fetch(`${API_KMB_BASE}/route-stop/${fav.route}/${dirStr}/${fav.serviceType}`);
              const json = await res.json();
              if (json.data) {
                const promises = json.data.slice(0, 50).map(async (item) => {
                  const r = await fetch(`${API_KMB_BASE}/stop/${item.stop}`);
                  const d = await r.json();
                  return { stopId: item.stop, stopName: getSafeStopName(d.data) };
                });
                fetchedStops = await Promise.all(promises);
              }
            } else if (fav.co === 'CTB') {
              const dirStr = fav.bound === 'O' ? 'outbound' : 'inbound';
              const res = await fetch(`${API_CTB_BASE}/stop/ctb/${fav.route}/${dirStr}`);
              const json = await res.json();
              if (json.data) {
                const promises = json.data.slice(0, 50).map(async (item) => {
                  const r = await fetch(`${API_CTB_BASE}/stop/${item.stop}`);
                  const d = await r.json();
                  return { stopId: item.stop, stopName: getSafeStopName(d.data) };
                });
                fetchedStops = await Promise.all(promises);
              }
            } else if (fav.co === 'NLB' && fav.routeId) {
              const res = await fetch(`${API_NLB_BASE}/stop.php?action=list&routeId=${fav.routeId}`);
              const json = await res.json();
              if (json.stops) {
                fetchedStops = json.stops.map(item => ({ stopId: item.stopId, stopName: getSafeStopName(item) }));
              }
            }

            if (fetchedStops.length > 0) {
              const stopIndex = fetchedStops.findIndex(s => s.stopId === fav.stopId);
              if (stopIndex !== -1) {
                fav.viaStops = fetchedStops.slice(stopIndex + 1, stopIndex + 4).map(s => s.stopName);
                updated = true;
              }
            }
          } catch (e) {
            console.error("背景補全途經站失敗: ", e);
          }
        }
      }
      if (updated) {
        saveFavorites();
        renderMainBoard();
        fetchAndUpdateAllETA();
      }
    }

    function saveFavorites() {
      localStorage.setItem('desktop_bus_favorites', JSON.stringify(favorites));
    }

    function renderSettingsFavorites() {
      if (favorites.length === 0) {
        favoriteList.innerHTML = `<p class="text-zinc-600 text-xs text-center py-4">暫無儲存路線</p>`;
        return;
      }

      favoriteList.innerHTML = "";
      favorites.forEach((fav, index) => {
        let coColor = "bg-red-600";
        if (fav.co === 'CTB') coColor = "bg-yellow-500 text-black";
        if (fav.co === 'NLB') coColor = "bg-green-600";

        const item = document.createElement('div');
        item.className = "flex justify-between items-center bg-zinc-800 border border-zinc-700/60 p-3 rounded-lg";
        item.innerHTML = `
          <div class="flex-1 min-w-0 pr-2">
            <div class="flex items-center gap-2">
              <span class="text-white text-xs font-black px-1.5 py-0.5 rounded font-mono ${coColor}">${fav.co} ${fav.route}</span>
              <span class="text-xs text-zinc-400 truncate">往 ${fav.boundName}</span>
            </div>
            <div class="text-sm font-semibold text-zinc-100 truncate mt-1">
              <i class="fa-solid fa-location-dot text-zinc-500 text-xs mr-1"></i>${fav.stopName}
            </div>
          </div>
          <button class="text-zinc-500 hover:text-red-500 p-2 transition-colors" onclick="deleteFavorite(${index})">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        favoriteList.appendChild(item);
      });
    }

    window.deleteFavorite = function(index) {
      favorites.splice(index, 1);
      saveFavorites();
      renderSettingsFavorites();
      showToast("已刪除該路線。");
    };

    // ==================== 渲染主畫面 ====================
    function renderMainBoard() {
      if (favorites.length === 0) {
        domNoDataTip.classList.remove('hidden');
        const cards = domMainDisplay.querySelectorAll('.bus-card');
        cards.forEach(c => c.remove());
        return;
      }

      domNoDataTip.classList.add('hidden');
      domMainDisplay.innerHTML = "";

      const count = favorites.length;

      favorites.forEach((fav, index) => {
        let cardHeightClass = "flex-1";
        
        let routeTextSize = "text-5xl md:text-7xl";
        let titleTextSize = "text-lg md:text-2xl";
        let stopTextSize = "text-xs md:text-sm";
        let etaTextSize = "text-4xl md:text-6xl";
        let etaSubTextSize = "text-sm md:text-lg";

        if (count === 1) {
          routeTextSize = "text-7xl md:text-9xl";
          titleTextSize = "text-2xl md:text-4xl";
          stopTextSize = "text-sm md:text-lg";
          etaTextSize = "text-6xl md:text-8xl";
          etaSubTextSize = "text-lg md:text-2xl";
        } else if (count === 2) {
          routeTextSize = "text-6xl md:text-8xl";
          titleTextSize = "text-xl md:text-3xl";
          stopTextSize = "text-xs md:text-base";
          etaTextSize = "text-5xl md:text-7xl";
          etaSubTextSize = "text-base md:text-xl";
        } else if (count >= 4) {
          routeTextSize = "text-4xl md:text-5xl";
          titleTextSize = "text-base md:text-xl";
          stopTextSize = "text-[10px] md:text-xs";
          etaTextSize = "text-3xl md:text-5xl";
          etaSubTextSize = "text-xs md:text-sm";
        }

        let leftBorder = "border-red-500";
        if (fav.co === 'CTB') leftBorder = "border-yellow-500";
        if (fav.co === 'NLB') leftBorder = "border-green-500";

        const card = document.createElement('div');
        card.id = `bus-card-${index}`;
        card.className = `bus-card ${cardHeightClass} bg-zinc-950/80 border-l-4 ${leftBorder} rounded-r-lg p-4 flex justify-between items-center transition-all duration-300 relative overflow-hidden`;
        
        let viaStopsHtml = "";
        if (fav.viaStops && fav.viaStops.length > 0) {
          viaStopsHtml = `
            <div class="text-[10px] md:text-xs text-zinc-400 truncate mt-1 flex items-center gap-1 opacity-90">
              <span class="bg-zinc-800 text-zinc-300 px-1 rounded text-[9px] font-bold shrink-0">途經</span>
              <span class="truncate text-orange-400/90 font-medium">${fav.viaStops.join(' → ')}</span>
            </div>
          `;
        }

        card.innerHTML = `
          <!-- 左半邊：巴士編號、終點、當前車站及途經站 -->
          <div class="flex items-center gap-4 min-w-0 flex-1">
            <div class="${routeTextSize} font-black led-text led-orange select-none tracking-tighter shrink-0 min-w-[2.2ch] text-center">
              ${fav.route}
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 text-zinc-400">
                <span class="text-[10px] px-1 bg-zinc-800 rounded font-bold shrink-0">${fav.co}</span>
                <span class="text-xs shrink-0">往</span>
                <span class="${titleTextSize} font-bold text-zinc-100 truncate leading-tight">${fav.boundName}</span>
              </div>
              <div class="${stopTextSize} text-zinc-300 font-bold truncate mt-1 flex items-center gap-1">
                <i class="fa-solid fa-location-dot text-orange-500 text-xs"></i>
                <span>${fav.stopName}</span>
              </div>
              <!-- 途經車站區 -->
              ${viaStopsHtml}
            </div>
          </div>

          <!-- 右半邊：大號實時分鐘，下兩班小字 -->
          <div class="text-right shrink-0 pl-3 border-l border-zinc-900 flex flex-col justify-center min-w-[120px] md:min-w-[180px] lg:min-w-[220px]">
            <div class="leading-none">
              <span id="eta-val-${index}" class="${etaTextSize} font-black led-text led-orange">--</span>
              <span id="eta-unit-${index}" class="${etaSubTextSize} font-bold led-text led-orange ml-0.5">分鐘</span>
            </div>
            <div id="eta-next-${index}" class="text-[10px] md:text-xs text-zinc-500 font-mono mt-1 space-y-0.5">
              載入中...
            </div>
          </div>
        `;
        domMainDisplay.appendChild(card);
      });
    }

    // ==================== 獲取所有最愛路線的實時 ETA ====================
    async function fetchAndUpdateAllETA() {
      if (favorites.length === 0) return;

      const now = new Date();
      domLastUpdate.textContent = `最後更新: ${now.toTimeString().split(' ')[0]}`;

      favorites.forEach(async (fav, index) => {
        try {
          let etaList = [];

          if (fav.co === 'KMB') {
            try {
              const url = `${API_KMB_BASE}/eta/${fav.stopId}/${fav.route}/${fav.serviceType}`;
              const r = await fetch(url);
              const text = await r.text();
              if (text && text.trim()) {
                const d = JSON.parse(text);
                if (d.data) {
                  etaList = d.data
                    .filter(item => item.dir === fav.bound)
                    .map(item => ({
                      eta: item.eta,
                      rmk: item.rmk_tc
                    }));
                }
              }
            } catch(err) {
              console.warn(`KMB ETA fetch failed for ${fav.route}:`, err);
            }
          } 
          else if (fav.co === 'CTB') {
            try {
              const url = `${API_CTB_BASE}/eta/ctb/${fav.stopId}/${fav.route}`;
              const r = await fetch(url);
              const text = await r.text();
              if (text && text.trim()) {
                const d = JSON.parse(text);
                if (d.data) {
                  etaList = d.data
                    .filter(item => item.dir === fav.bound)
                    .map(item => ({
                      eta: item.eta,
                      rmk: item.rmk_tc
                    }));
                }
              }
            } catch(err) {
              console.warn(`CTB ETA fetch failed for ${fav.route}:`, err);
            }
          }
          else if (fav.co === 'NLB') {
            // [自動自癒] 檢查並動態補齊記憶體與 localStorage
            let nlbRouteId = fav.routeId;
            if (!nlbRouteId && allRoutes.length > 0) {
              const foundRoute = allRoutes.find(r => r.co === 'NLB' && r.route === fav.route);
              if (foundRoute) {
                nlbRouteId = foundRoute.routeId;
                fav.routeId = nlbRouteId; 
                saveFavorites(); 
              }
            }

            if (nlbRouteId) {
              try {
                const url = `${API_NLB_BASE}/stop.php?action=estimated-arrival-time&routeId=${nlbRouteId}&stopId=${fav.stopId}`;
                const r = await fetch(url);
                const text = await r.text();
                // 核心安全修正：確保回應不為空，防止 JSON.parse 崩潰
                if (text && text.trim()) {
                  const d = JSON.parse(text);
                  if (d.estimatedArrivalTimes) {
                    etaList = d.estimatedArrivalTimes.map(item => ({
                      eta: item.estimatedArrivalTime,
                      rmk: item.wheelChair === 1 ? "輪椅" : ""
                    }));
                  }
                }
              } catch(err) {
                console.warn(`NLB ETA fetch failed for ${fav.route}:`, err);
              }
            } else {
              setCardOffline(index, "連線中...");
              return;
            }
          }

          updateCardETA(index, etaList);

        } catch (error) {
          console.error("更新 ETA 發生未知錯誤: ", error);
          setCardOffline(index, "連線錯誤");
        }
      });
    }

    // ==================== 更新單張卡片 ====================
    function updateCardETA(index, etaList) {
      const valDom = document.getElementById(`eta-val-${index}`);
      const unitDom = document.getElementById(`eta-unit-${index}`);
      const nextDom = document.getElementById(`eta-next-${index}`);
      const cardDom = document.getElementById(`bus-card-${index}`);

      if (!valDom || !etaList || etaList.length === 0) {
        setCardOffline(index, "沒有班次");
        return;
      }

      const now = new Date();
      const validEtas = [];

      etaList.forEach(item => {
        if (!item.eta) return;
        
        const etaTime = new Date(item.eta.replace(' ', 'T')); 
        const diffMs = etaTime - now;
        const diffMins = Math.max(0, Math.floor(diffMs / 1000 / 60));
        
        // 正規表達式高相容安全截取，解決各種日期和非標準字串解析
        let timePart = "00:00";
        const timeMatch = item.eta.match(/(\d{2}:\d{2})/);
        if (timeMatch) {
          timePart = timeMatch[1];
        } else {
          timePart = item.eta.includes('T') ? item.eta.split('T')[1].substring(0, 5) : item.eta.split(' ')[1].substring(0, 5);
        }

        validEtas.push({
          mins: diffMins,
          rmk: item.rmk || "",
          timeStr: timePart
        });
      });

      validEtas.sort((a, b) => a.mins - b.mins);

      if (validEtas.length === 0) {
        setCardOffline(index, "未有資料");
        return;
      }

      const firstBus = validEtas[0];
      
      if (firstBus.mins <= 1) {
        valDom.textContent = `即將到站 (${firstBus.mins}分)`;
        valDom.className = "text-xl md:text-3xl lg:text-4xl font-black led-text led-green animate-pulse";
        unitDom.style.display = "none";
        cardDom.classList.remove('border-red-500', 'border-yellow-500', 'border-green-500');
        cardDom.classList.add('border-emerald-500');
      } else {
        valDom.textContent = firstBus.mins;
        
        const count = favorites.length;
        
        let targetSize = "text-4xl md:text-7xl";
        if (count === 1) {
          targetSize = "text-6xl md:text-8xl";
        } else if (count === 2) {
          targetSize = "text-5xl md:text-7xl";
        } else if (count >= 4) {
          targetSize = "text-3xl md:text-5xl";
        }
        
        valDom.className = `${targetSize} font-black led-text led-orange`;
        unitDom.style.display = "inline";
        
        let unitSize = "text-sm md:text-lg";
        unitDom.className = `${unitSize} font-bold led-text led-orange ml-0.5`;
        
        const fav = favorites[index];
        cardDom.classList.remove('border-emerald-500', 'border-red-500', 'border-yellow-500', 'border-green-500');
        let borderClass = "border-red-500";
        if (fav.co === 'CTB') borderClass = "border-yellow-500";
        if (fav.co === 'NLB') borderClass = "border-green-500";
        cardDom.classList.add(borderClass);
      }

      let nextHtml = "";
      for (let i = 1; i < Math.min(3, validEtas.length); i++) {
        const bus = validEtas[i];
        const rmkText = bus.rmk ? ` (${bus.rmk})` : "";
        nextHtml += `
          <div class="flex justify-end gap-2 text-zinc-400">
            <span>下班: <b class="text-zinc-200 font-bold">${bus.timeStr}</b></span>
            <span class="text-orange-500/80 font-bold">${bus.mins}分${rmkText}</span>
          </div>
        `;
      }

      if (nextHtml === "") {
        nextDom.innerHTML = `<span class="text-zinc-600">後面暫無班次</span>`;
      } else {
        nextDom.innerHTML = nextHtml;
      }
    }

    function setCardOffline(index, msg) {
      const valDom = document.getElementById(`eta-val-${index}`);
      const unitDom = document.getElementById(`eta-unit-${index}`);
      const nextDom = document.getElementById(`eta-next-${index}`);
      const cardDom = document.getElementById(`bus-card-${index}`);

      if (valDom) {
        valDom.textContent = msg;
        valDom.className = "text-xl md:text-2xl font-bold text-zinc-600";
        if (unitDom) unitDom.style.display = "none";
        if (nextDom) nextDom.innerHTML = `<span class="text-zinc-700">無法獲取數據</span>`;
        if (cardDom) {
          cardDom.classList.remove('border-red-500', 'border-yellow-500', 'border-green-500', 'border-emerald-500');
          cardDom.className = cardDom.className.replace(/border-(red|yellow|green|emerald)-500/g, '');
          cardDom.classList.add('border-zinc-800');
        }
      }
    }
  </script>
